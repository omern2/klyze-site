  <script>
    (function () {
      var FEATURES = {
        analiz: { n: "01",
          tr: { t: "Maç Analizi", d: "Her maçın röntgeni. Oynadıkça biriken verin, nerede düştüğünü net gösterir.",
            b: [["Son 20 maç", "Tarih, harita, mod, skor, K/D/A ve RR değişimi tek listede."], ["RR grafiği", "Rank atlama ve düşme noktalarıyla zaman çizelgesi."], ["Harita ve ajan kırılımı", "ADR, HS oranı, giriş skorları ve en çok oynananlar."], ["Sezon karşılaştırma", "Bu sezon ve önceki sezon yan yana."]] },
          en: { t: "Match Analysis", d: "An x-ray of every match. Your accumulating data clearly shows where you drop.",
            b: [["Last 20 matches", "Date, map, mode, score, K/D/A and RR change in one list."], ["RR graph", "Timeline with rank-up and rank-down points."], ["Map and agent breakdown", "ADR, HS rate, entry scores and most played."], ["Season comparison", "This season and last season side by side."]] } },
        overlay: { n: "02",
          tr: { t: "Canlı Overlay", d: "Oyun üstünde şeffaf panel. Maç anında ihtiyacın olan her şey gözünün önünde.",
            b: [["Ctrl+K kısayolu", "Tek tuşla açılır, tıklamalar oyuna geçer."], ["Takımlar ve ajanlar", "Kadrolar, rank ve RR bilgileri anlık."], ["Ekonomi takibi", "Full, eco, half ve force alımları renkli."], ["Smurf tespiti", "Düşük rank + yüksek performans analizi."]] },
          en: { t: "Live Overlay", d: "Transparent in-game panel. Everything you need mid-match, right in front of you.",
            b: [["Ctrl+K hotkey", "Opens with one key, clicks pass through to the game."], ["Teams and agents", "Lineups, rank and RR info live."], ["Economy tracking", "Full, eco, half and force buys in color."], ["Smurf detection", "Low rank + high performance analysis."]] } },
        grup: { n: "03",
          tr: { t: "Grup Bul", d: "Tek başına kuyruğa girme. Seviyene uygun takımı dakikalar içinde kur.",
            b: [["Lobi aç veya katıl", "Harita, mod ve role göre filtrele."], ["Anlık sohbet", "Lobi içi mesajlaşma gecikmesiz."], ["Hazır durumu", "Kim hazır, kim değil anında gör."], ["Davet linki", "Tek tıkla kopyala, arkadaşını çağır."]] },
          en: { t: "Find Group", d: "Stop queuing solo. Build a team at your level in minutes.",
            b: [["Open or join lobbies", "Filter by map, mode and role."], ["Real-time chat", "In-lobby messaging without delay."], ["Ready status", "See instantly who is ready."], ["Invite link", "Copy in one click, invite your friend."]] } },
        ai: { n: "04",
          tr: { t: "Klyze AI", d: "Maçlarını bilen yapay zekâ koçu. Sor, analiz etsin, yol göstersin.",
            b: [["Sohbetle sor", "Performansını, haritalarını, ajanlarını sor."], ["Web aramalı cevaplar", "Güncel meta ve yama bilgileri dahil."], ["Sohbet geçmişi", "Eski konuşmaların kayıtlı kalır."]] },
          en: { t: "Klyze AI", d: "An AI coach that knows your matches. Ask, and it analyses and guides.",
            b: [["Ask in chat", "Ask about your performance, maps and agents."], ["Web-backed answers", "Includes current meta and patch info."], ["Chat history", "Your past conversations stay saved."]] } },
        akis: { n: "05",
          tr: { t: "Akış", d: "Topluluğun nabzı. Gündemi kaçırma.",
            b: [["Gönderiler", "Avatar, isim, rank ve tarihle birlikte."], ["Beğeni ve yorum", "Etkileşim anında yansır."], ["Sonsuz kaydırma", "Aşağı indikçe yenileri yüklenir."]] },
          en: { t: "Feed", d: "The pulse of the community. Never miss a thing.",
            b: [["Posts", "With avatar, name, rank and date."], ["Likes and comments", "Interactions reflect instantly."], ["Infinite scroll", "More loads as you scroll down."]] } },
        liderlik: { n: "06",
          tr: { t: "Liderlik", d: "Zirve yarışı. Yerini gör, hedefini koy.",
            b: [["Sıralama", "Rank, RR, winrate ve K/D'ye göre."], ["Filtreler", "Rank aralığı, bölge ve arama."], ["Oyuncu analizi", "Karta tıkla, o oyuncunun verisine git."]] },
          en: { t: "Leaderboard", d: "The race to the top. See your place, set your goal.",
            b: [["Standings", "By rank, RR, winrate and K/D."], ["Filters", "Rank range, region and search."], ["Player analysis", "Click a card to open that player's data."]] } },
        profil: { n: "07",
          tr: { t: "Profilim", d: "Kimliğin tek ekranda.",
            b: [["Hesap özeti", "Riot ID, tag, rank ikonu, RR ve level."], ["Oyun içi kart", "Kart görselinle birlikte."], ["Son 5 maç", "Harita, skor, K/D ve RR özetleri."], ["Ajanlar", "En çok oynadıkların listeli."]] },
          en: { t: "My Profile", d: "Your identity on one screen.",
            b: [["Account summary", "Riot ID, tag, rank icon, RR and level."], ["Player card", "With your in-game card art."], ["Last 5 matches", "Map, score, K/D and RR summaries."], ["Agents", "Your most played, listed."]] } },
        asistan: { n: "08",
          tr: { t: "Oyun İçi Asistan", d: "Valorant açıkken yanında duran akıllı takip.",
            b: [["Otomatik algılama", "Oyun açılınca devreye girer."], ["Canlı maç verisi", "Anlık skor ve olay takibi."], ["Durum takibi", "Maçın akışına göre akıllı görünüm."]] },
          en: { t: "In-Game Assistant", d: "Smart tracking that stays with you while Valorant is open.",
            b: [["Auto detection", "Kicks in when the game opens."], ["Live match data", "Real-time score and event tracking."], ["State tracking", "Smart view following the match flow."]] } }
      };
      function lang() {
        try { return localStorage.getItem("klyze-lang") === "en" ? "en" : "tr"; }
        catch (e) { return "tr"; }
      }
      function render() {
        var id = new URLSearchParams(location.search).get("id");
        var f = FEATURES[id];
        if (!f) { location.replace("/#ozellikler"); return; }
        var L = lang();
        var c = f[L];
        document.documentElement.lang = L;
        document.title = c.t + " — Klyze.gg";
        document.getElementById("dNum").textContent = (L === "en" ? "FEATURE / " : "ÖZELLİK / ") + f.n;
        document.getElementById("dTitle").textContent = c.t;
        document.getElementById("dDesc").textContent = c.d;
        var ul = document.getElementById("dList");
        ul.innerHTML = "";
        c.b.forEach(function (row) {
          var li = document.createElement("li");
          var s = document.createElement("strong");
          s.textContent = row[0];
          li.appendChild(s);
          li.appendChild(document.createTextNode(" — " + row[1]));
          ul.appendChild(li);
        });
        document.querySelectorAll("[data-tr]").forEach(function (el) {
          el.textContent = L === "en" ? el.getAttribute("data-en") : el.getAttribute("data-tr");
        });
        document.querySelectorAll(".lang-switch button").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-lang") === L);
        });
      }
      document.querySelectorAll(".lang-switch button").forEach(function (b) {
        b.addEventListener("click", function () {
          try { localStorage.setItem("klyze-lang", b.getAttribute("data-lang")); } catch (e) {}
          render();
        });
      });
      render();
    })();
  </script>
