  <script>
    (function () {
      var SUPABASE_URL = "https://wshbwkgujaspnflnwnwx.supabase.co";
      var SUPABASE_ANON = "sb_publishable_1_eY31wnWDkYY6DQ6masNw_IQZpm5Gi";
      var btn = document.getElementById("googleBtn");
      var btnLabel = document.getElementById("googleBtnLabel");
      var err = document.getElementById("authErr");
      var profile = document.getElementById("loginProfile");
      var sbClient = null;
      var redirected = false;
      function showErr(msg) {
        err.textContent = msg;
        err.hidden = !msg;
      }
      function temizMi(v) { return /^\/[a-z0-9_-]+$/i.test(v) && v !== "/login"; }
      function hedef() {
        try {
          var q = new URLSearchParams(location.search).get("next") || "";
          if (temizMi(q)) return q;
        } catch (e) {}
        try {
          if (document.referrer && new URL(document.referrer).origin === location.origin) {
            var p = new URL(document.referrer).pathname.replace(/\.html$/, "") || "/";
            if (p === "/") return "/";
            if (temizMi(p)) return p;
          }
        } catch (e) {}
        return "/";
      }
      function goHome() {
        if (redirected) return;
        redirected = true;
        var h = hedef();
        setTimeout(function () { location.href = h; }, 900);
      }
      function render(user) {
        var logged = !!user;
        btn.hidden = logged;
        profile.hidden = !logged;
        if (!logged) return;
        document.getElementById("pfName").textContent = user.name;
        document.getElementById("pfEmail").textContent = user.email || "";
        document.getElementById("pfRol").innerHTML = window.klyzeRozet
          ? window.klyzeRozet((window.KlyzeAuth && window.KlyzeAuth.rol) || null) : "";
        var av = document.getElementById("pfAvatar");
        av.src = user.avatar;
        av.alt = "";
      }
      function waitAuth(fn) {
        var n = 0;
        var iv = setInterval(function () {
          if (window.KlyzeAuth) { clearInterval(iv); fn(); }
          else if (++n > 60) { clearInterval(iv); showErr("Bağlantı kütüphanesi yüklenemedi — internetini kontrol edip tekrar dene."); }
        }, 100);
      }
      function init() {
        if (location.protocol === "file:") {
          showErr("Bu sayfa dosya olarak açılmış — Google girişi için siteyi sunucudan aç (python app.py, sonra http://127.0.0.1:8000/login).");
          btn.disabled = true;
          return;
        }
        waitAuth(function () {
          try { sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON); }
          catch (e) { showErr("Bağlantı kurulamadı — biraz sonra tekrar dene."); return; }
          var A = window.KlyzeAuth;
          // Google donusundeki hatayi aynen goster (teshis icin)
          try {
            var q = new URLSearchParams(location.search);
            var err = q.get("error"), errDesc = q.get("error_description");
            if (err) {
              showErr("Google girişi başarısız (" + err + "): " + (errDesc || "bilinmeyen hata"));
            } else if (q.get("code")) {
              setTimeout(function () {
                if (!window.KlyzeAuth || !window.KlyzeAuth.user) {
                  showErr("Dönüş alındı ama oturum kurulamadı — gizli sekme/adblocker/yerel depolama engeli olabilir, normal sekmede tekrar dene.");
                }
              }, 8000);
            }
          } catch (e) {}
          A.ready.then(function () {
            render(A.user);
            if (A.user) goHome();
          });
          var first = true;
          A.onChange(function (u) {
            render(u);
            if (u && !first) goHome();
            first = false;
          });
          btn.addEventListener("click", function () {
            showErr("");
            btn.disabled = true;
            if (btnLabel) btnLabel.textContent = "Google'a yönlendiriliyor...";
            sbClient.auth.signInWithOAuth({
              provider: "google",
              options: { redirectTo: location.href.split("#")[0] }
            }).then(function (res) {
              if (res && res.error) {
                btn.disabled = false;
                if (btnLabel) btnLabel.textContent = "Google ile devam et";
                showErr("Google girişi açılamadı: " + (res.error.message || "bilinmeyen hata"));
              }
            });
          });
          document.getElementById("logoutBtn").addEventListener("click", function () {
            A.signOut();
          });
        });
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
      else init();
    })();
  </script>
